<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Avatar önizleme</title>
<style>
  :root { --zemin:#ffffff; --yazi:#2B2436; --ince:#6b6478; --cizgi:#ece8f2; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:#f6f4f9; color:var(--yazi); }
  header { padding:16px; position:sticky; top:0; background:#f6f4f9ee; z-index:2; border-bottom:1px solid var(--cizgi); }
  h1 { font-size:18px; margin:0 0 8px; }
  .secim { display:flex; flex-wrap:wrap; gap:6px; }
  .secim button { border:1px solid var(--cizgi); background:#fff; border-radius:999px; padding:4px 10px 4px 4px; cursor:pointer; display:flex; align-items:center; gap:6px; font:inherit; }
  .secim button[aria-pressed="true"] { border-color:#2B2436; }
  .secim i { width:18px; height:18px; border-radius:50%; display:inline-block; }
  .panel { padding:16px; }
  .panel.koyu { background:#17151d; color:#eeeaf5; }
  .panel.acik { background:#ffffff; }
  h2 { font-size:15px; margin:4px 0 10px; }
  h3 { font-size:12px; font-weight:600; margin:14px 0 6px; opacity:.7; }
  .izgara { display:flex; flex-wrap:wrap; gap:12px; }
  .kutu { display:flex; flex-direction:column; align-items:center; width:96px; font-size:11px; text-align:center; }
  .kutu span { margin-top:4px; opacity:.75; }
  .kucuk { display:flex; flex-wrap:wrap; gap:8px; }
  svg.av { display:block; }
  .matris td { padding:2px; }
  .matris th { font-size:11px; font-weight:500; text-align:right; padding-right:8px; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>KPSS Tercihi forum avatarları (önizleme, sitede bağlı değil)</h1>
  <div class="secim" id="secim"></div>
</header>
<main id="ana"></main>
<script src="avatarlar.js"></script>
<script>
(function () {
  var K = window.KIT_AVATAR, ana = document.getElementById('ana'), secim = document.getElementById('secim');
  var NS = 'http://www.w3.org/2000/svg';
  function av(anahtar, boy, renk) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'av'); s.setAttribute('width', boy); s.setAttribute('height', boy);
    s.setAttribute('viewBox', '0 0 64 64'); s.setAttribute('role', 'img');
    s.style.setProperty('--av-z', renk);
    var u = document.createElementNS(NS, 'use'); u.setAttribute('href', 'avatarlar.svg#' + K.onek + anahtar);
    s.appendChild(u); return s;
  }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; }
  var param = new URLSearchParams(location.search);
  var secili = param.get('r') || 'hepsi';
  function ciz() {
    ana.innerHTML = '';
    var renkler = secili === 'hepsi' ? K.renkler : K.renkler.filter(function (r) { return r.anahtar === secili; });
    if (secili === 'matris') renkler = [];
    ['acik', 'koyu'].forEach(function (tema) {
      var p = el('section', 'panel ' + tema);
      p.appendChild(el('h2', '', tema === 'acik' ? 'Açık arayüz' : 'Koyu arayüz'));
      if (secili === 'matris') {
        var tb = el('table', 'matris');
        K.renkler.forEach(function (r) {
          var tr = el('tr'); tr.appendChild(el('th', '', r.ad));
          K.avatarlar.forEach(function (a) { var td = el('td'); td.appendChild(av(a.anahtar, 28, r.renk)); tr.appendChild(td); });
          tb.appendChild(tr);
        });
        p.appendChild(tb);
      }
      renkler.forEach(function (r) {
        p.appendChild(el('h3', '', r.ad + ' ' + r.renk));
        K.gruplar.forEach(function (g) {
          var iz = el('div', 'izgara');
          K.avatarlar.filter(function (a) { return a.grup === g.anahtar; }).forEach(function (a) {
            var k = el('div', 'kutu'); k.appendChild(av(a.anahtar, 96, r.renk)); k.appendChild(el('span', '', a.ad)); iz.appendChild(k);
          });
          p.appendChild(el('h3', '', g.ad)); p.appendChild(iz);
        });
        var kc = el('div', 'kucuk');
        K.avatarlar.forEach(function (a) { kc.appendChild(av(a.anahtar, 28, r.renk)); });
        p.appendChild(el('h3', '', '28 px')); p.appendChild(kc);
      });
      ana.appendChild(p);
    });
  }
  function dugme(anahtar, ad, renk) {
    var b = el('button'); b.type = 'button';
    if (renk) { var i = el('i'); i.style.background = renk; b.appendChild(i); }
    b.appendChild(document.createTextNode(ad));
    b.setAttribute('aria-pressed', String(secili === anahtar));
    b.onclick = function () { secili = anahtar; history.replaceState(null, '', '?r=' + anahtar);
      Array.prototype.forEach.call(secim.children, function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true'); ciz(); };
    secim.appendChild(b);
  }
  dugme('hepsi', 'Tüm renkler'); dugme('matris', '28 px matris');
  K.renkler.forEach(function (r) { dugme(r.anahtar, r.ad, r.renk); });
  ciz();
})();
</script>
</body>
</html>
