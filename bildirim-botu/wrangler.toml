name = "kamu-ilan-bildirim"
main = "src/index.js"
compatibility_date = "2026-05-22"

[triggers]
crons = ["* * * * *"]

# D1 veritabani: `wrangler d1 create kamu-ilan-bildirim` ciktisindaki id'yi asagiya yaz,
# sonra `wrangler d1 execute kamu-ilan-bildirim --remote --file=schema.sql` ile tablolari olustur.
[[d1_databases]]
binding = "DB"
database_name = "kamu-ilan-bildirim"
database_id = "cb1fc32e-001d-45e6-b4aa-51ea3b274af8"

[vars]
ILAN_URL = "https://enesfeched-maker.github.io/kamu-ilan-takip/bot-ilanlar.json"
SITE_URL = "https://enesfeched-maker.github.io/kamu-ilan-takip/"
VIP_ACIK = "0"
YONETICI_KULLANICI = ""   # yöneticinin Telegram kullanıcı adı (@ olmadan)

# Sirlar (degerleri buraya YAZILMAZ; `wrangler secret put <AD>` ile eklenir):
#   BOT_TOKEN       -> BotFather'dan alinan bot anahtari
#   WEBHOOK_SECRET  -> setWebhook'ta secret_token olarak verilen rastgele metin