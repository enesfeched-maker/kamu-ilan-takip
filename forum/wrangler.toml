# KPSS Tercihi - forum / topluluk API'si (Cloudflare Worker + D1).
# Uretim adimlari icin KURULUM.md dosyasina bak. Buradaki hicbir sey kendiliginden dagitilmaz.
name = "kpss-forum"
main = "src/giris.js"   # yalnız varsayılan işleyici; bkz. src/giris.js
compatibility_date = "2026-05-22"

[[routes]]
pattern = "forum-api.kpsstercihi.com"
custom_domain = true

# D1: once `wrangler d1 create kpss-forum` calistir, cikan id'yi asagiya yaz,
# sonra `wrangler d1 execute kpss-forum --remote --file=schema.sql --config wrangler.toml`.
[[d1_databases]]
binding = "DB"
database_name = "kpss-forum"
database_id = "BURAYA-ID"

[vars]
SITE_URL = "https://kpsstercihi.com/"
IZINLI_KOKENLER = "https://kpsstercihi.com,https://www.kpsstercihi.com"
# Acil durumda tum yazmalari durdurmak icin "1" yap ve yeniden dagit (yonetim uclari acik kalir).
YAZMA_KAPALI = "0"
TELEGRAM_BOT_ADI = "kamuilanibot"
# Google ile giris (Google Cloud > KPSS Tercihi > OAuth istemcisi; gizli degil, tarayicida da gorunur).
GOOGLE_ISTEMCI_KIMLIGI = "518005490003-av27v4bupeul4po4a6mihi5bdtd7fejt.apps.googleusercontent.com"

# Sirlar (degerleri buraya YAZILMAZ): `wrangler secret put <AD> --config wrangler.toml`
#   TELEGRAM_BOT_TOKEN  - giris dogrulamasi ve bildirimler
#   OTURUM_SIRRI        - oturum jetonlarinin imzasi (uzun rastgele metin)
#   YONETICI_ANAHTARI   - X-Yonetici basligi icin yonetim anahtari
#   SIFRE_BIBERI        - ZORUNLU (sifre/kurtarma kodu icin; OTURUM_SIRRI'ndan farkli uzun rastgele metin). Yoksa sifreli uyelik kapali.
#   TURNSTILE_GIZLI     - istege bagli (robot kontrolu); TURNSTILE_SITE ve GOOGLE_ISTEMCI_KIMLIGI [vars] olarak tanimlanir
# Yerel deneme: wrangler dev --local --var ORTAM:yerel --var OTURUM_SIRRI:deneme --var SIFRE_BIBERI:deneme --var YONETICI_ANAHTARI:deneme
# (ORTAM=yerel: /giris/deneme acilir, localhost kokenleri izinli olur, Telegram bildirimi gonderilmez.
#  Uretimde ORTAM tanimli degildir.)
