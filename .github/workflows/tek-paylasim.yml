name: Tek seferlik kanal paylaşımı

on:
  workflow_dispatch:
    inputs:
      tanim:
        description: "paylasim/ altındaki JSON tanımı"
        required: true

permissions:
  contents: read

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0 pdfplumber==0.11.7
      - name: Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TANIM: ${{ inputs.tanim }}
        run: python bot/tek_paylasim.py "$TANIM"
