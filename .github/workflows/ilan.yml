name: İlanları tara

on:
  schedule:
    - cron: "*/30 * * * *"   # yaklaşık 30 dakikada bir (GitHub gecikebilir)
  workflow_dispatch:
    inputs:
      duyur_mevcut:
        description: Mevcut ilanları da Telegram'a gönder
        type: boolean
        default: false
  push:
    branches: [main]
    # Yerel tarayıcının veri aktarımları ayrı bir tam tarama başlatmaz;
    # bir sonraki zamanlanmış taramada kullanılır.
    paths-ignore:
      - docs/yerel-kaynaklar.json
      - docs/belgeler/**
      - docs/assets/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ilan-tara
  cancel-in-progress: false

jobs:
  tara:
    # macos-latest (arm64) kapasite sıkıntısında saatlerce iş almıyor; Intel macOS havuzu ayrı.
    runs-on: macos-15-intel
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Logo önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: .cache/logolar
          key: logolar-${{ github.run_id }}
          restore-keys: logolar-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Görsel bağımlılığını kur
        run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0
      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUYUR_MEVCUT: ${{ inputs.duyur_mevcut }}
        run: |
          python -m unittest discover -s bot -p 'test_*.py'
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          try:
              token = os.environ['TELEGRAM_BOT_TOKEN']
              chat = os.environ['TELEGRAM_CHAT_ID']
              assert token and chat
              base = 'https://api.telegram.org/bot' + token + '/'
              def api(method, **params):
                  req = urllib.request.Request(base + method, data=urllib.parse.urlencode(params).encode())
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
                  assert result['ok']
                  return result['result']
              me = api('getMe')
              member = api('getChatMember', chat_id=chat, user_id=me['id'])
              assert member.get('can_post_messages'), 'Mesaj gönderme yetkisi eksik'
              print('Telegram botu ve kanal gönderim yetkisi doğrulandı.')
          except Exception:
              sys.exit('Telegram bağlantısı doğrulanamadı. Gizli değerleri ve botun kanal yetkisini kontrol edin.')
          PY
          if [ "$DUYUR_MEVCUT" = "true" ]; then
            python bot/ilan_bot.py --prepare --duyur-mevcut
          else
            python bot/ilan_bot.py --prepare
          fi
      - name: Değişen veriyi kaydet
        if: ${{ always() }}
        run: python bot/veri_kaydet.py
      - name: İlan sayfalarını oluştur
        id: portal
        if: ${{ !cancelled() }}
        run: |
          python -m unittest discover -s bot -p 'test_site_uret.py'
          python -m unittest discover -s bot -p 'test_liste_verisi.py'
          python bot/site_uret.py
      - name: Pages yapılandır
        if: ${{ !cancelled() && steps.portal.outcome == 'success' }}
        uses: actions/configure-pages@v5
      - name: Site dosyalarını hazırla
        if: ${{ !cancelled() && steps.portal.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      # "Siteyi yayınla" iş akışı aynı anda Pages'e yayın yaparsa GitHub ikinci isteği 400 ile reddeder;
      # bu durumda bir süre beklenip bir kez daha denenir (Telegram adımı yayına bağlı olduğu için önemli).
      - name: Siteyi yayınla
        if: ${{ !cancelled() && steps.portal.outcome == 'success' }}
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Eşzamanlı yayının bitmesini bekle
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 90
      - name: Siteyi yayınla (yeniden dene)
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        id: deployment2
        uses: actions/deploy-pages@v4
      - name: Yayımlanan ilanları Telegram'a gönder
        id: telegram
        if: ${{ !cancelled() && (steps.deployment.outcome == 'success' || steps.deployment2.outcome == 'success') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/ilan_bot.py --send-only
      - name: Telegram gönderim geçmişini kaydet
        if: ${{ always() && steps.telegram.outcome != 'skipped' }}
        run: python bot/veri_kaydet.py
