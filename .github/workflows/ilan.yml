name: İlanları tara

on:
  schedule:
    - cron: "*/30 * * * *"   # yaklaşık 30 dakikada bir (GitHub gecikebilir)
  workflow_dispatch:
    inputs:
      duyur_mevcut:
        description: Mevcut ilanları da Telegram'a gönder
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ilan-tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUYUR_MEVCUT: ${{ inputs.duyur_mevcut }}
        run: |
          python -m unittest discover -s bot -p 'test_*.py'
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          try:
              token = os.environ['TELEGRAM_BOT_TOKEN']
              chat = os.environ['TELEGRAM_CHAT_ID']
              assert token and chat
              base = 'https://api.telegram.org/bot' + token + '/'
              def api(method, **params):
                  req = urllib.request.Request(base + method, data=urllib.parse.urlencode(params).encode())
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
                  assert result['ok']
                  return result['result']
              me = api('getMe')
              member = api('getChatMember', chat_id=chat, user_id=me['id'])
              assert member.get('can_post_messages'), 'Mesaj gönderme yetkisi eksik'
              print('Telegram botu ve kanal gönderim yetkisi doğrulandı.')
          except Exception:
              sys.exit('Telegram bağlantısı doğrulanamadı. Gizli değerleri ve botun kanal yetkisini kontrol edin.')
          PY
          if [ "$DUYUR_MEVCUT" = "true" ]; then
            python bot/ilan_bot.py --duyur-mevcut
          else
            python bot/ilan_bot.py
          fi
      - name: Değişen veriyi kaydet
        if: ${{ always() }}
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add docs/ilanlar.json
          git diff --cached --quiet || (git commit -m "ilanlar güncellendi" && git pull --rebase && git push)
      - name: Pages yapılandır
        uses: actions/configure-pages@v5
      - name: Site dosyalarını hazırla
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
