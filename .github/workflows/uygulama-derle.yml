name: Uygulamayi derle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'uygulama/**'
      - '.github/workflows/uygulama-derle.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            uygulama
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: uygulama
      - run: npx cap sync android
        working-directory: uygulama
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: uygulama/android
      - uses: actions/upload-artifact@v4
        with:
          name: kpss-tercihi-android-debug
          path: uygulama/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            uygulama
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: uygulama
      - run: npx cap sync ios
        working-directory: uygulama
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: uygulama/ios/App
