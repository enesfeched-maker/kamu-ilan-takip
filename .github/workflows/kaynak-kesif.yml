name: Kaynak keşfi (geçici)

on:
  push:
    branches: [claude/vibrant-hopper-mwm2uk]
    paths: [.github/workflows/kaynak-kesif.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kesif:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4==4.13.5 pypdf==6.0.0
      - name: ÇŞB yerel yönetimler ilan sayfalarını incele
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 kamu-ilan-takip kesif'}
          def al(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30) as r:
                      return r.read().decode('utf-8','replace'), r.geturl()
              except Exception as e:
                  print('HATA',u,type(e).__name__,str(e)[:150]); return '',u
          kok='https://yerelyonetimler.csb.gov.tr/'
          html,son=al(kok); print('KOK',son,len(html))
          doc=BeautifulSoup(html,'html.parser')
          adaylar=set()
          for a in doc.find_all('a',href=True):
              t=' '.join(a.get_text(' ').split()); h=urllib.parse.urljoin(son,a['href'])
              if re.search(r'ilan|personel|al[ıi]m|duyuru',(t+' '+h).lower()):
                  print('LINK',repr(t[:80]),h); adaylar.add(h)
          for h in sorted(adaylar)[:8]:
              print('\n=====',h)
              s,_=al(h); d=BeautifulSoup(s,'html.parser')
              for el in d.select('table tr')[:25]:
                  print('TR',' | '.join(' '.join(td.get_text(' ').split())[:70] for td in el.find_all(['td','th'])))
              for a in d.find_all('a',href=True)[:400]:
                  t=' '.join(a.get_text(' ').split())
                  if re.search(r'belediye|il[aâ]n|al[ıi]m',t.lower()) and len(t)>25:
                      print('A',t[:120],'->',urllib.parse.urljoin(h,a['href']))
          PY
      - name: İŞKUR belediye ilanlarını listele
        run: |
          cd bot && python - <<'PY'
          from ek_kaynaklar import read_iskur
          kayitlar,hata=read_iskur({})
          print('ISKUR toplam',len(kayitlar),'hata',hata)
          for k in kayitlar:
              if 'belediye' in (k['kurum']+k['baslik']).lower() or 'il özel' in k['kurum'].lower():
                  print('BEL',k['son_tarih'],'|',k['yer'],'|',k['kurum'],'|',k['baslik'][:90])
          PY
