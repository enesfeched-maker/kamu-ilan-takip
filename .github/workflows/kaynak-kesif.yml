name: Kaynak keşfi (geçici)

on:
  push:
    branches: [claude/vibrant-hopper-mwm2uk]
    paths: [.github/workflows/kaynak-kesif.yml]

permissions:
  contents: read

jobs:
  kesif:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4==4.13.5
      - shell: python
        run: |
          import re, urllib.request, urllib.parse
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'}
          def al(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=25) as r:
                      d=r.read().decode('utf-8','replace'); print('OK',r.status,len(d),u); return d,r.geturl()
              except Exception as e:
                  print('HATA',u,type(e).__name__,str(e)[:120]); return '',u
          def linkler(html,base,desen,n=40):
              d=BeautifulSoup(html,'html.parser'); k=0
              for a in d.find_all('a',href=True):
                  t=' '.join(a.get_text(' ').split()); h=urllib.parse.urljoin(base,a['href'])
                  if re.search(desen,(t+' '+h).lower()):
                      print('  LINK',t[:110],'->',h); k+=1
                      if k>=n: break
          h,b=al('https://yerelyonetimler.csb.gov.tr/')
          if h: linkler(h,b,r'duyuru-\d+|ilan')
          h,b=al('https://yerelyonetimler.csb.gov.tr/istanbul-ili-sile-belediye-baskanligina-ilk-defa-atanmak-uzere-memur-ve-zabita-memuru-alim-ilani-duyuru-477953')
          if h:
              d=BeautifulSoup(h,'html.parser')
              print('  BASLIK',d.title.get_text(' ',strip=True) if d.title else '')
              m=d.find('main') or d.body
              print('  METIN',' '.join(m.get_text(' ').split())[:1500])
              linkler(h,b,r'\.pdf|indir|ek')
          h,b=al('https://www.osym.gov.tr/')
          if h: linkler(h,b,r'kpss')
          al('https://dokuman.osym.gov.tr/')
