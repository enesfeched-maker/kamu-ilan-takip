name: Sosyal medya ajanı

# Her gün ~09:40 TR: Instagram ölçümlerini tazeler, yeni yorumları yöneticiye Telegram'dan bildirir; pazartesi haftalık
# özeti gönderir (bot/sosyal_ajan.py). Ayrıca Claude bulut rutininin (sosyal/ajan-talimat.md) gönderdiği sosyal-ajan-*
# dallarını denetleyip yalnız sosyal/ayar.json ve sosyal/ajan-gunlugu.md dosyalarını main'e alır.
on:
  schedule:
    - cron: "40 6 * * *"
  push:
    branches: ["sosyal-ajan-*"]
  workflow_dispatch:
    inputs:
      rapor:
        description: Haftalık özeti şimdi gönder
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sosyal-ajan
  cancel-in-progress: false

jobs:
  takip:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5
      - name: Yorum durumunu geri yükle
        uses: actions/cache/restore@v4
        with:
          path: sosyal-yorum-durum.json
          key: sosyal-yorum-geri-yukle
          restore-keys: sosyal-yorum-
      - name: Yeni yorumları bildir
        continue-on-error: true
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          IG_ERISIM_ANAHTARI: ${{ secrets.IG_ERISIM_ANAHTARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_YONETICI_ID: ${{ secrets.TELEGRAM_YONETICI_ID }}
        run: python bot/sosyal_ajan.py yorum
      - name: Yorum durumunu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sosyal-yorum-durum.json
          key: sosyal-yorum-${{ github.run_id }}
      - name: Haftalık özet
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          IG_ERISIM_ANAHTARI: ${{ secrets.IG_ERISIM_ANAHTARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_YONETICI_ID: ${{ secrets.TELEGRAM_YONETICI_ID }}
          ELLE: ${{ inputs.rapor }}
        run: |
          if [ "$(TZ=Europe/Istanbul date +%u)" = "1" ] || [ "$ELLE" = "true" ]; then
            python bot/sosyal_istatistik.py topla || true
            python bot/sosyal_ajan.py rapor
          else
            echo "Bugün rapor günü değil."
          fi

  karar-al:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0 pdfplumber==0.11.7
      - name: Denetle ve main'e al
        env:
          DAL: ${{ github.ref_name }}
        run: |
          git config user.name ilan-bot
          git config user.email ilan-bot@users.noreply.github.com
          git fetch -q --depth=1 origin "$DAL"
          # Ajan başka dosyaya dokunmuş olsa da yalnız bu iki dosya alınır.
          git show "FETCH_HEAD:sosyal/ayar.json" > sosyal/ayar.json
          git show "FETCH_HEAD:sosyal/ajan-gunlugu.md" > sosyal/ajan-gunlugu.md
          python bot/sosyal_ajan.py dogrula
          python -m unittest bot.test_sosyal_ajan bot.test_reels
          git add sosyal/ayar.json sosyal/ajan-gunlugu.md
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "Sosyal ajan kararı [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi
          git push -q origin --delete "$DAL" || true
