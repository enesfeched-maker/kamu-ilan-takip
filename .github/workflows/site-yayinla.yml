      - 'bot/sonuc_takip.py'
      - 'bot/sosyal_ajan.py'
      - 'bot/sosyal_baglanti.py'
      - 'bot/sosyal_kalite.py'
      - 'bot/sosyal_motor.py'
      - 'bot/haftalik.py'
      - 'bot/sosyal_paylasim.py'
      - 'bot/sosyal_tasarim.py'
      - 'bot/sosyal_yayinla.py'
      - 'bot/veri_kaydet.py'
