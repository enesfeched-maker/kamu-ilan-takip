name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths:
      - 'docs/puanlar/**'
      - 'docs/index.html'
      - 'docs/portal.js'
      - 'docs/portal.css'
      - 'docs/bugun.css'
      - 'docs/sayfa.css'
      - 'docs/sayfa.js'
      - 'docs/manifest.webmanifest'
      - 'bot/liste_verisi.py'
      - 'bot/site_uret.py'
      - 'bot/kurum_sayfasi.py'
      - 'bot/kart_tasarimlari.py'
      - 'bot/kurum_gorseli.py'
      - 'bot/meslek_gorseli.py'
      - 'bot/kurum_logolari.json'
      - 'bot/fontlar/**'
      - 'docs/assets/**'
      - '.github/workflows/site-yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    # İki iş akışı da Pages'e yayın yapar; aynı anda yayın GitHub'da çakışır.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Logo önbelleğini geri yükle
        uses: actions/cache@v6.1.0
        with:
          path: .cache/logolar
          key: logolar-${{ github.run_id }}
          restore-keys: logolar-
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Görsel bağımlılığını kur
        run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0
      - name: İlan sayfalarını oluştur
        run: |
          python -c "from PIL import features; print('Pillow WebP desteği:', features.check('webp'))"
          python -m unittest discover -s bot -p 'test_site_*.py'
          python -m unittest discover -s bot -p 'test_liste_verisi.py'
          python bot/site_uret.py
      - name: Pages yapılandır
        uses: actions/configure-pages@v6.0.0
      - name: Site dosyalarını hazırla
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs
      # Tarama iş akışı aynı anda yayın yapıyorsa GitHub 400 döner: bekleyip bir kez daha dene.
      - name: Siteyi yayınla
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
      - name: Eşzamanlı yayının bitmesini bekle
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 90
      - name: Siteyi yayınla (yeniden dene)
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment2
        uses: actions/deploy-pages@v5.0.1
