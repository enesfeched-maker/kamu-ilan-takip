name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths:
      - 'docs/puanlar/**'
      - 'docs/index.html'
      - 'docs/portal.js'
      - 'docs/portal.css'
      - 'bot/site_uret.py'
      - 'bot/kart_tasarimlari.py'
      - 'bot/kurum_gorseli.py'
      - 'bot/meslek_gorseli.py'
      - 'bot/kurum_logolari.json'
      - 'bot/fontlar/**'
      - 'docs/assets/**'
      - '.github/workflows/site-yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Logo önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: .cache/logolar
          key: logolar-${{ github.run_id }}
          restore-keys: logolar-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Görsel bağımlılığını kur
        run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0
      - name: İlan sayfalarını oluştur
        run: |
          python -c "from PIL import features; print('Pillow WebP desteği:', features.check('webp'))"
          python -m unittest discover -s bot -p 'test_site_*.py'
          python bot/site_uret.py
      - name: Pages yapılandır
        uses: actions/configure-pages@v5
      - name: Site dosyalarını hazırla
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
