name: Tarih bombası kontrolü

# Testleri 7 ve 30 gün sonrasındaymış gibi koşar. Düşerse taramalar o tarihte duracak demektir;
# GitHub hata e-postası gönderir, düzeltmek için haftalar kalır. Tarama/yayın akışını etkilemez.
on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 Türkiye
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0 freezegun==1.5.5
      - name: Testleri ileri tarihlerde koş
        run: python bot/zaman_kontrol.py 7 30
