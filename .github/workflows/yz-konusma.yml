name: Anlatıcı sunucuyu konuştur (SadTalker)

# yz-konusma-* dalına gönderimde çalışır: yz-medya/girdi/sunucu.png + anlatim.wav → dudak senkronlu video (yapıt: yz-konusma).
# SadTalker (OpenTalker, Apache-2.0) CPU'da çalışır; ağır kurulum yerel bilgisayar yerine burada yapılır.
on:
  push:
    branches: ['yz-konusma-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  konustur:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Kurulum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git ../SadTalker
          python -m pip install -q --upgrade pip wheel setuptools
          pip install -q torch==2.1.2+cpu torchvision==0.16.2+cpu torchaudio==2.1.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          # yeni çekirdeklerde "cannot enable executable stack" hatasına karşı
          pip install -q patchelf
          for so in $(python -c "import os,site;print(os.path.join(site.getsitepackages()[0],'torch','lib'))")/*.so*; do patchelf --clear-execstack "$so" || true; done
          pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba==0.56.4 \
            resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 av safetensors
          pip install -q --no-build-isolation basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          cd ../SadTalker
          mkdir -p checkpoints gfpgan/weights
          R=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors SadTalker_V0.0.2_512.safetensors; do
            curl -sSL --retry 5 -o checkpoints/$f $R/$f; done
          curl -sSL --retry 5 -o gfpgan/weights/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          curl -sSL --retry 5 -o gfpgan/weights/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          curl -sSL --retry 5 -o gfpgan/weights/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          curl -sSL --retry 5 -o gfpgan/weights/parsing_parsenet.pth https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth
          ls -la checkpoints gfpgan/weights
          python -c "import torch, torchvision, basicsr, gfpgan, face_alignment, librosa; print('torch', torch.__version__)"
      - name: Konuştur
        run: |
          cd ../SadTalker
          python inference.py --driven_audio "$GITHUB_WORKSPACE/yz-medya/girdi/anlatim.wav" \
            --source_image "$GITHUB_WORKSPACE/yz-medya/girdi/sunucu.png" --result_dir "$GITHUB_WORKSPACE/yz-konusma" \
            --still --preprocess full --size 512 --expression_scale 1.1 --cpu
          ls -laR "$GITHUB_WORKSPACE/yz-konusma"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yz-konusma
          path: yz-konusma/
          retention-days: 7
