name: Sosyal medyada özel paylaşım

# Hazır bir videoyu (ör. katiplik tanıtımı) Instagram/YouTube/TikTok'a bir kez gönderir; günlük sosyal.yml'e dokunmaz.
# Tanım: sosyal/ozel/<ad>.json -> {"video": "paylasim/x.mp4", "baslik": "...", "aciklama": "...", "etiketler": [...]}
on:
  workflow_dispatch:
    inputs:
      tanim:
        description: "sosyal/ozel/ altındaki JSON tanımı"
        required: true

permissions:
  contents: write

concurrency:
  group: sosyal
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0 pdfplumber==0.11.7
      - name: Hazırla
        id: h
        env:
          TANIM: ${{ inputs.tanim }}
        run: |
          mkdir sosyal-cikti
          # zaman: WhatsApp kanal botu paylaşımı geçmişteki aynı zamanlı kayıtla eşleştirir
          python -c "import json,os,shutil,datetime as t;d=json.load(open(os.environ['TANIM'],encoding='utf-8'));d.setdefault('zaman',t.datetime.now(t.timezone(t.timedelta(hours=3))).isoformat(timespec='seconds'));shutil.copy(d['video'],'sosyal-cikti/reel.mp4');json.dump(d,open('sosyal-cikti/paylasim.json','w',encoding='utf-8'),ensure_ascii=False)"
          echo "etiket=sosyal-$(TZ=Europe/Istanbul date +%Y%m%d)-$(basename "$TANIM" .json)" >> "$GITHUB_OUTPUT"
      - name: Önizleme sürümü
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ steps.h.outputs.etiket }}
        run: |
          python -c "import json;d=json.load(open('sosyal-cikti/paylasim.json',encoding='utf-8'));open('notlar.md','w',encoding='utf-8').write(d['baslik']+'\n\n'+d['aciklama'])"
          gh release delete "$ETIKET" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$ETIKET" sosyal-cikti/* --title "$ETIKET" --notes-file notlar.md --prerelease
      - name: Yayınla
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          IG_ERISIM_ANAHTARI: ${{ secrets.IG_ERISIM_ANAHTARI }}
          YT_ISTEMCI_KIMLIGI: ${{ secrets.YT_ISTEMCI_KIMLIGI }}
          YT_ISTEMCI_SIRRI: ${{ secrets.YT_ISTEMCI_SIRRI }}
          YT_YENILEME_ANAHTARI: ${{ secrets.YT_YENILEME_ANAHTARI }}
          YT_KANAL: ${{ vars.YT_KANAL }}
          SOSYAL_KAPALI: ${{ vars.SOSYAL_KAPALI }}
          TT_ISTEMCI_ANAHTARI: ${{ secrets.TT_ISTEMCI_ANAHTARI }}
          TT_ISTEMCI_SIRRI: ${{ secrets.TT_ISTEMCI_SIRRI }}
          TT_YENILEME_ANAHTARI: ${{ secrets.TT_YENILEME_ANAHTARI }}
          TT_MOD: ${{ vars.TT_MOD }}
          BUFFER_API_ANAHTARI: ${{ secrets.BUFFER_API_ANAHTARI }}
          BUFFER_TIKTOK_KANAL: ${{ vars.BUFFER_TIKTOK_KANAL }}
          FB_SAYFA_ID: ${{ vars.FB_SAYFA_ID }}
          FB_ERISIM_ANAHTARI: ${{ secrets.FB_ERISIM_ANAHTARI }}
          SOSYAL_GH_ANAHTARI: ${{ secrets.SOSYAL_GH_ANAHTARI }}
          VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.h.outputs.etiket }}/reel.mp4
        run: python bot/sosyal_yayinla.py sosyal-cikti
      - name: Paylaşım geçmişini kaydet
        env:
          TANIM: ${{ inputs.tanim }}
        run: |
          # Hiçbir platformda paylaşılamadıysa geçmişe yazılmaz.
          python -c "import json,pathlib,sys;p=pathlib.Path('sosyal-cikti/sonuc.json');s=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {};sys.exit(0 if s and any('hata' not in v for v in s.values()) else 1)" || { echo "Paylaşılamadı; geçmişe yazılmadı."; exit 0; }
          python - <<'PY'
          import json, os, pathlib
          d = json.loads(pathlib.Path('sosyal-cikti/paylasim.json').read_text(encoding='utf-8'))
          yol = pathlib.Path('sosyal/gecmis.json')
          g = json.loads(yol.read_text(encoding='utf-8'))
          ad = pathlib.Path(os.environ['TANIM']).stem
          g.append({'zaman': d['zaman'], 'vakit': 'ozel', 'tur': 'ozel', 'anahtar': f'ozel:{ad}'})
          yol.write_text(json.dumps(g, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          PY
          python bot/sosyal_istatistik.py sonuc sosyal-cikti || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosyal/gecmis.json
          git diff --cached --quiet && exit 0
          git commit -m "Sosyal paylaşım geçmişi (${{ steps.h.outputs.etiket }}) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
