name: Sosyal medya paylaşımı

# Asıl tetik Cloudflare zamanlayıcısı (12:30 öğle, 21:00 akşam, pazar 19:00); aşağıdaki GitHub cron'ları yedektir,
# gecikip gece çalışırsa saat kapısı (bot/yayin_kapisi.py) paylaşımı durdurur.
# Günde iki paylaşım (öğle ~12:30, akşam ~21:00) ve pazar ~19:00 haftalık veri dizisi: Instagram Reels, YouTube Shorts, TikTok. İçerik bot/sosyal_motor.py, yayın bot/sosyal_yayinla.py.
# Her çıktı (kareler, video, açıklama) "sosyal-..." sürümü olarak saklanır: telefondan önizleme için.
on:
  schedule:
    - cron: "20 9 * * *"    # ~12:30 TR öğle (Reels için en güçlü gündüz dilimi; GitHub 5–15 dk gecikir)
    - cron: "50 17 * * *"   # ~21:00 TR akşam (Instagram ve TikTok'un en yoğun saati)
    - cron: "0 16 * * 0"    # ~19:00 TR pazar: haftalık veri dizisi (bot/haftalik.py; verisi yetmezse paylaşım yok)
  workflow_dispatch:
    inputs:
      vakit:
        description: sabah, aksam, haftalik ya da otomatik (saate göre)
        type: choice
        options: [otomatik, sabah, aksam, haftalik]
        default: otomatik
      yayinla:
        description: Platformlara gönder (kapalıysa yalnız önizleme sürümü; geçmişe yazılmaz)
        type: boolean
        default: true
      kaynak:
        description: "Tetikleyen (zamanlayici = Cloudflare; elle başlatınca dokunma)"
        required: false
        default: elle

permissions:
  contents: write

concurrency:
  group: sosyal
  cancel-in-progress: false

jobs:
  kapi:
    runs-on: ubuntu-latest
    outputs:
      izin: ${{ steps.k.outputs.izin }}
    steps:
      - uses: actions/checkout@v4
      - name: Saat kapısı
        id: k
        run: |
          V="${{ inputs.vakit }}"
          if [ "${{ github.event.schedule }}" = "0 16 * * 0" ]; then V=haftalik; fi
          if [ -z "$V" ] || [ "$V" = "otomatik" ]; then
            H=$(TZ=Europe/Istanbul date +%H); if [ "$H" -lt 17 ]; then V=sabah; else V=aksam; fi
            if [ "$(TZ=Europe/Istanbul date +%u)" = "7" ] && [ "$H" -ge 18 ] && [ "$H" -lt 20 ]; then V=haftalik; fi
          fi
          ELLE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.kaynak }}" != "zamanlayici" ]; then ELLE="--elle"; fi
          python bot/yayin_kapisi.py "$V" $ELLE >> "$GITHUB_OUTPUT"

  paylas:
    needs: kapi
    if: needs.kapi.outputs.izin == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.5 pypdf==6.0.0 pdfplumber==0.11.7 imageio-ffmpeg==0.6.0
      - name: Vakit
        id: v
        run: |
          V="${{ inputs.vakit }}"
          if [ "${{ github.event.schedule }}" = "0 16 * * 0" ]; then V=haftalik; fi
          if [ -z "$V" ] || [ "$V" = "otomatik" ]; then
            H=$(TZ=Europe/Istanbul date +%H); if [ "$H" -lt 17 ]; then V=sabah; else V=aksam; fi
            if [ "$(TZ=Europe/Istanbul date +%u)" = "7" ] && [ "$H" -ge 18 ] && [ "$H" -lt 20 ]; then V=haftalik; fi
          fi
          echo "vakit=$V" >> "$GITHUB_OUTPUT"
          echo "etiket=sosyal-$(TZ=Europe/Istanbul date +%Y%m%d)-$V" >> "$GITHUB_OUTPUT"
      - name: Instagram istatistikleri
        # 2–30 günlük Reels'in izlenme/paylaşım sayıları; tür ve müzik ağırlıkları sosyal/istatistik.json'a yazılır.
        continue-on-error: true
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          IG_ERISIM_ANAHTARI: ${{ secrets.IG_ERISIM_ANAHTARI }}
        run: python bot/sosyal_istatistik.py topla
      - name: İçerik üret
        id: uret
        run: |
          python bot/sosyal_motor.py --vakit "${{ steps.v.outputs.vakit }}" --cikti sosyal-cikti
          # haftalık dizide veri yetmezse (ya da bu hafta yapıldıysa / kota dolduysa) hiçbir şey üretilmez
          if [ -f sosyal-cikti/paylasim.json ]; then echo "var=1" >> "$GITHUB_OUTPUT"; else echo "var=0" >> "$GITHUB_OUTPUT"; fi
      - name: Önizleme sürümü
        if: steps.uret.outputs.var == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ steps.v.outputs.etiket }}
        run: |
          python -c "import json;d=json.load(open('sosyal-cikti/paylasim.json',encoding='utf-8'));open('notlar.md','w',encoding='utf-8').write(d['baslik']+'\n\n'+d['aciklama'])"
          gh release delete "$ETIKET" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$ETIKET" sosyal-cikti/* --title "$ETIKET" --notes-file notlar.md --prerelease
          # en yeni 30 paylaşım saklanır
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^sosyal-' | sort -r | tail -n +31 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
      - name: Yayınla
        if: steps.uret.outputs.var == '1' && (github.event_name == 'schedule' || inputs.yayinla)
        env:
          IG_KULLANICI_ID: ${{ secrets.IG_KULLANICI_ID }}
          IG_ERISIM_ANAHTARI: ${{ secrets.IG_ERISIM_ANAHTARI }}
          YT_ISTEMCI_KIMLIGI: ${{ secrets.YT_ISTEMCI_KIMLIGI }}
          YT_ISTEMCI_SIRRI: ${{ secrets.YT_ISTEMCI_SIRRI }}
          YT_YENILEME_ANAHTARI: ${{ secrets.YT_YENILEME_ANAHTARI }}
          YT_KANAL: ${{ vars.YT_KANAL }}
          SOSYAL_KAPALI: ${{ vars.SOSYAL_KAPALI }}
          TT_ISTEMCI_ANAHTARI: ${{ secrets.TT_ISTEMCI_ANAHTARI }}
          TT_ISTEMCI_SIRRI: ${{ secrets.TT_ISTEMCI_SIRRI }}
          TT_YENILEME_ANAHTARI: ${{ secrets.TT_YENILEME_ANAHTARI }}
          TT_MOD: ${{ vars.TT_MOD }}
          BUFFER_API_ANAHTARI: ${{ secrets.BUFFER_API_ANAHTARI }}
          BUFFER_TIKTOK_KANAL: ${{ vars.BUFFER_TIKTOK_KANAL }}
          FB_SAYFA_ID: ${{ vars.FB_SAYFA_ID }}
          FB_ERISIM_ANAHTARI: ${{ secrets.FB_ERISIM_ANAHTARI }}
          SOSYAL_GH_ANAHTARI: ${{ secrets.SOSYAL_GH_ANAHTARI }}
          VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.etiket }}/reel.mp4
        run: |
          EK=""
          if [ "$(date +%u)" = "1" ] && [ "${{ steps.v.outputs.vakit }}" = "sabah" ]; then EK="--instagram-yenile"; fi
          python bot/sosyal_yayinla.py sosyal-cikti $EK
      - name: Paylaşım geçmişini kaydet
        if: always() && steps.uret.outcome == 'success' && steps.uret.outputs.var == '1' && (github.event_name == 'schedule' || inputs.yayinla)
        run: |
          # Bağlı platformların hepsi hata verdiyse konu "paylaşıldı" sayılmaz; sonraki çalışmada yeniden denenir.
          if ! python -c "import json,pathlib,sys;p=pathlib.Path('sosyal-cikti/sonuc.json');s=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {};sys.exit(0 if not s or any('hata' not in v for v in s.values()) else 1)"; then
            echo "Hiçbir platformda paylaşılamadı; geçmişe yazılmadı."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot/sosyal_istatistik.py sonuc sosyal-cikti || true
          git add sosyal/gecmis.json
          if [ -f sosyal/istatistik.json ]; then git add sosyal/istatistik.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Sosyal paylaşım geçmişi (${{ steps.v.outputs.etiket }}) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
